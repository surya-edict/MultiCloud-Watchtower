repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: forbid-aws-keys
        name: forbid-aws-keys
        entry: (?i)AKIA[0-9A-Z]{16}
        language: pygrep
        types: [text]
      - id: forbid-slack-webhooks
        name: forbid-slack-webhooks
        entry: https://hooks\.slack\.com/services/T[A-Z0-9]{8}/B[A-Z0-9]{8,}/[A-Za-z0-9]+
        language: pygrep
        types: [text]
